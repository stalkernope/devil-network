name: DEVIL NETWORK autopost

on:
  schedule:
    - cron: "0 5,8,11,14,17 * * *"   # новости (08, 11, 14, 17, 20 МСК)
    - cron: "0 6 * * *"              # CVE дня (09:00 МСК)
    - cron: "0 12 * * 2,5"           # инструмент (вт, пт 15:00 МСК)
    - cron: "0 16 * * *"             # квиз (19:00 МСК)
  workflow_dispatch:
    inputs:
      mode:
        description: "news | cve | tool | quiz"
        default: "news"

permissions:
  contents: write

concurrency:
  group: autopost
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Выбор режима
        id: m
        env:
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
        run: |
          case "$SCHEDULE" in
            "0 6 * * *")    echo "mode=cve"  >> "$GITHUB_OUTPUT" ;;
            "0 12 * * 2,5") echo "mode=tool" >> "$GITHUB_OUTPUT" ;;
            "0 16 * * *")   echo "mode=quiz" >> "$GITHUB_OUTPUT" ;;
            "")             echo "mode=${INPUT_MODE:-news}" >> "$GITHUB_OUTPUT" ;;
            *)              echo "mode=news" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Публикация
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python bot.py ${{ steps.m.outputs.mode }}

      - name: Сохранить список опубликованного
        run: |
          git config user.name "devil-network-bot"
          git config user.email "bot@users.noreply.github.com"
          git add posted.json
          git diff --cached --quiet || (git commit -m "update posted" && git pull --rebase && git push)
